vxmq:
  broker:
    enabled: true
    host: 0.0.0.0
    port: 1883
    max-message-size: 268435455
    timeout-on-connect-seconds: 10
    receive-maximum: 65535
    offline-queue-capacity-per-session: 1024
    authn:
      no-match: allow
    authz:
      no-match: allow

quarkus:
  kafka:
    devservices:
      enabled: false
  log:
    category:
      "io.github.vxmqmqtt.vxmq":
        level: INFO
  devservices:
    enabled: false
